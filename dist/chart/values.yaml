# [MANAGER]: Manager Deployment Configurations
controllerManager:
  replicas: 1
  container:
    image:
      repository: ghcr.io/kreibich04/odoo-operator
      tag: latest
    imagePullPolicy: IfNotPresent
    args:
      - "--leader-elect"
      - "--metrics-bind-address=:8443"
      - "--health-probe-bind-address=:8081"
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 20
      httpGet:
        path: /healthz
        port: 8081
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      httpGet:
        path: /readyz
        port: 8081
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 10
  serviceAccountName: operator-controller-manager

# [RBAC]: To enable RBAC (Permissions) configurations
rbac:
  enable: true
  # watchNamespaces restricts the operator to only these namespaces: a namespaced Role +
  # RoleBinding is created in each one instead of a cluster-wide ClusterRole/ClusterRoleBinding,
  # and the manager is told to only watch these namespaces (see the matching --watch-namespaces
  # arg derived from this same list in templates/manager/manager.yaml). Leave empty (the default)
  # for the original cluster-wide behavior.
  watchNamespaces: []

# [CRDs]: To enable the CRDs
crd:
  # This option determines whether the CRDs are included
  # in the installation process.
  enable: true

  # Enabling this option adds the "helm.sh/resource-policy": keep
  # annotation to the CRD, ensuring it remains installed even when
  # the Helm release is uninstalled.
  # NOTE: Removing the CRDs will also remove all cert-manager CR(s)
  # (Certificates, Issuers, ...) due to garbage collection.
  keep: true

# [METRICS]: Set to true to generate manifests for exporting metrics.
# To disable metrics export set false, and ensure that the
# ControllerManager argument "--metrics-bind-address=:8443" is removed.
metrics:
  enable: true

# [PROMETHEUS]: To enable a ServiceMonitor to export metrics to Prometheus set true
prometheus:
  enable: false

# [CERT-MANAGER]: To enable cert-manager injection to webhooks set true
certmanager:
  enable: false

# [NETWORK POLICIES]: To enable NetworkPolicies set true
networkPolicy:
  enable: false
  # controllerEgress additionally restricts the controller-manager pod's own egress traffic
  # (instead of just the existing metrics-ingress policy) to DNS, the Kubernetes API server, and
  # anything listed in extraEgress. Off by default since the exact apiserver reachability
  # (ClusterIP vs. node port, which ports) varies by cluster; enable and tune once you know your
  # cluster's topology.
  controllerEgress:
    enable: false
    dnsPort: 53
    apiServerPorts:
      - 443
      - 6443
    # extraEgress is a raw passthrough list of additional NetworkPolicyEgressRule entries
    # (https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.34/#networkpolicyegressrule-v1-networking-k8s-io),
    # for anything else the controller needs to reach (a webhook, an OIDC provider, ...).
    extraEgress: []
