{{- if .Values.rbac.enable }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: operator-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - get
  - list
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - get
  - list
  - update
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - cloud.alterway.fr
  resources:
  - odoobackups
  - odoorestores
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cloud.alterway.fr
  resources:
  - odoobackups/finalizers
  - odoorestores/finalizers
  - odoos/finalizers
  verbs:
  - update
- apiGroups:
  - cloud.alterway.fr
  resources:
  - odoobackups/status
  - odoorestores/status
  - odoos/status
  verbs:
  - get
  - update
- apiGroups:
  - cloud.alterway.fr
  resources:
  - odoos
  verbs:
  - get
  - list
  - update
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - watch
{{- end -}}
